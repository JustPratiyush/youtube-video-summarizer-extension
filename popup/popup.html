<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Summariser</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon-32.png" alt="" width="20" height="20" />
      <h1>Video Summariser</h1>
      <button id="settings" class="icon-btn" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12" />
          <circle cx="16" cy="6" r="2" />
          <circle cx="10" cy="12" r="2" />
          <circle cx="18" cy="18" r="2" />
        </svg>
      </button>
    </header>

    <main>
      <p id="target" class="target"></p>

      <form id="form" autocomplete="off">
        <label for="url" class="visually-hidden">YouTube link</label>
        <input id="url" type="text" placeholder="Paste a YouTube link…" spellcheck="false" autofocus />
        <div id="actions" class="actions"></div>
      </form>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <section id="open-videos" hidden>
        <h2>Or pick an open YouTube tab</h2>
        <ul id="open-video-list"></ul>
      </section>
    </main>

    <footer id="footer"></footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
